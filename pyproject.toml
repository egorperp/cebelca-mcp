[project]
name = "cebelca-mcp"
version = "0.1.0"
description = "MCP server for the Slovenian invoicing service Čebelca BIZ"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cebelca-mcp = "cebelca_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cebelca_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
